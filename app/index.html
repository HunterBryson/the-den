<!doctype html>
<!-- making-a-ui: refs=his kept UI Taste header (count tiles, actions right), Railway (named targets, open dot-grid work area), Robinhood Legend (named tiles), his pick of three pictures Nov 12 (den-a2.png) -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Den</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/odie.ico">
<style>
:root { --bg:#0c0c0e; --bar:#18181b; --surf:#202024; --surf2:#2a2a2f; --well:#040405; --line:#2f2f35; --line2:#4b4b54; --edge:#6a6a75; --ink:#f4f4f6; --dim:#a4a4ae; --faint:#6c6c76; --blue:#4cc2ff; --amber:#f5a524; --green:#3ecf8e; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
#app { display: grid; grid-template-rows: 124px 1fr auto; height: 100%; }

/* ---- top bar ---- */
#top { display: flex; align-items: stretch; border-bottom: 2px solid #000; background: var(--bar); min-width: 0; box-shadow: 0 6px 18px #000a; position: relative; z-index: 2; }
#brand { width: 400px; flex: none; position: relative; overflow: hidden; background: var(--bar); }
#brand::before { content: ''; position: absolute; inset: 0; background: url(banner.png) left center / auto 100% no-repeat; -webkit-mask-image: linear-gradient(90deg, #000 0, #000 34%, transparent 62%); mask-image: linear-gradient(90deg, #000 0, #000 34%, transparent 62%); }
#brand a { position: absolute; left: 196px; top: 26px; text-decoration: none; color: var(--ink); }
#brand b { display: block; font-size: 38px; line-height: 1; font-weight: 700; letter-spacing: -.5px; text-shadow: 0 2px 14px #000; }
#brand small { display: block; margin-top: 8px; font-size: 15px; color: #d0d0d6; text-shadow: 0 1px 8px #000; }
#brand .home { position: absolute; left: 196px; top: 6px; font-size: 12px; color: var(--faint); }
#brand .home.gal { left: 292px; }
#mid { flex: 1; min-width: 0; padding: 12px 22px 0; border-left: 1px solid var(--line2); }
#count { font-size: 19px; font-weight: 650; color: var(--amber); margin-bottom: 8px; }
#count span { color: var(--dim); font-weight: 500; }
#tiles { display: flex; gap: 10px; }
.tile { flex: 1 1 0; max-width: 190px; min-width: 0; height: 70px; border: 1.5px solid var(--line2); border-radius: 12px; background: var(--surf); display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 0 12px; text-align: left; transition: border-color .15s, background .15s; }
.tile:hover { border-color: var(--edge); background: var(--surf2); }
.tile .row { display: flex; align-items: center; gap: 9px; }
.tile .nm { font-size: 14px; font-weight: 600; color: #dcdce2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .n { font-size: 25px; font-weight: 700; line-height: 1; }
.tile.zero { background: #19191c; border-color: var(--line); } .tile.zero .nm { color: var(--dim); font-weight: 500; } .tile.zero .n, .tile.zero svg { color: var(--faint); }
.tile.you.has { border-color: var(--blue); border-width: 2px; background: #0b2a3f; box-shadow: 0 0 18px #4cc2ff55; } .tile.you.has svg, .tile.you.has .n { color: var(--blue); }
.tile.odie.has { border-color: var(--amber); border-width: 2px; background: #33230a; box-shadow: 0 0 18px #f5a52455; } .tile.odie.has .n { color: var(--amber); }
.tile.on { background: #3a3a41; border-color: var(--ink); border-width: 2px; }
.tile img { width: 24px; height: 24px; border-radius: 50%; flex: none; }
#acts { flex: none; display: flex; align-items: center; gap: 12px; padding: 0 20px; border-left: 1px solid var(--line2); }
#send { height: 62px; padding: 0 24px; border-radius: 31px; background: var(--blue); color: #04121d; font-size: 19px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
#send small { display: block; font-size: 13px; font-weight: 600; opacity: .8; }
#send.idle { background: transparent; color: var(--blue); box-shadow: inset 0 0 0 2px #2f6f93; }
#send svg { fill: currentColor; stroke: none; }
#drop { height: 62px; padding: 0 18px; border-radius: 31px; border: 2px dashed var(--edge); color: var(--ink); font-size: 16px; font-weight: 600; line-height: 1.15; }
#drop:hover { border-color: var(--ink); }

/* ---- the list and the work area ---- */
#main { display: grid; grid-template-columns: 292px 1fr; min-height: 0; }
#side { background: #111113; border-right: 2px solid #000; padding: 14px 12px 8px 16px; overflow-y: auto; min-height: 0; }
#side h2 { margin: 0 0 12px; font-size: 21px; font-weight: 700; } #side h2 small { font-size: 14px; color: var(--dim); font-weight: 500; margin-left: 6px; cursor: pointer; }
.card { position: relative; border: 1.5px solid var(--line2); border-radius: 12px; background: var(--surf); box-shadow: 0 3px 10px #0009; margin-bottom: 12px; overflow: hidden; cursor: pointer; transition: border-color .15s; }
.card:hover { border-color: var(--ink); }
.card.out { border-color: var(--blue); box-shadow: 0 0 0 2px var(--blue), 0 0 18px #4cc2ff44; } .card.out .nm { background: #0b2a3f; }
.card .th { height: 118px; background: #000 center top / cover no-repeat; border-bottom: 1px solid var(--line2); display: flex; align-items: center; justify-content: center; color: var(--faint); font-size: 13px; padding: 10px; text-align: center; overflow: hidden; }
.card .nm { padding: 8px 12px 10px; font-size: 16px; font-weight: 600; line-height: 1.25; }
.card .tag { position: absolute; top: 8px; left: 8px; right: 8px; font-size: 13px; font-weight: 700; }
.card .tag span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; padding: 4px 10px; border-radius: 10px; background: var(--blue); color: #04121d; max-width: 100%; box-sizing: border-box; overflow: hidden; line-height: 1.3; }
.card .tag span.new { display: inline-block; }
.card .tag span.new { background: var(--green); }
.card .do { position: absolute; right: 8px; top: 84px; display: flex; gap: 6px; }
.card .do button.away { display: none; } .card:hover .do button.away { display: block; }
.card .do button { padding: 4px 10px; border-radius: 9px; background: #000e; border: 1px solid var(--edge); font-size: 13px; font-weight: 600; } .card .do button:hover { border-color: var(--ink); }
.job { border: 1.5px solid var(--amber); border-radius: 12px; background: #1c1608; padding: 12px 14px; margin-bottom: 12px; font-size: 16px; font-weight: 600; display: flex; gap: 10px; align-items: center; }
.job img { width: 34px; height: 34px; border-radius: 50%; } .job small { display: block; color: var(--dim); font-weight: 500; font-size: 13px; }
.job .bar { height: 5px; border-radius: 3px; background: #3a2c0c; overflow: hidden; margin-top: 6px; } .job .bar i { display: block; height: 100%; width: 40%; background: var(--amber); border-radius: 3px; animation: sweep 1.6s ease-in-out infinite; }
@keyframes sweep { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
.none { color: var(--dim); font-size: 15px; padding: 6px 2px; }

#work { position: relative; margin: 14px 16px 12px; border: 1px solid #000; border-radius: 16px; background: var(--well) radial-gradient(#2c2c33 1.2px, transparent 1.3px) 0 0 / 22px 22px; box-shadow: inset 0 3px 22px #000, 0 0 0 1px var(--line); min-height: 0; min-width: 0; padding: 16px; display: grid; gap: 16px; }
#work.n1 { grid-template: 1fr / 1fr; } #work.n2 { grid-template: 1fr / 1fr 1fr; } #work.n3 { grid-template: 1fr 1fr / 1fr 1fr; } #work.n4 { grid-template: 1fr 1fr / 1fr 1fr; }
#work.n3 .item:nth-child(3) { grid-column: 1 / 3; justify-self: center; width: 62%; }
#work.over { border-color: var(--blue); }
#merge { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 3; width: 104px; height: 104px; border-radius: 52px; border: 2px solid var(--amber); background: #2b1e07; color: #fff; font-size: 14px; font-weight: 700; line-height: 1.15; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; box-shadow: 0 8px 26px #000, 0 0 0 6px var(--well); }
#merge.top { top: 25%; }
#merge svg { color: var(--amber); width: 26px; height: 26px; } #merge:hover { background: var(--amber); color: #1a1000; } #merge:hover svg { color: #1a1000; }
#empty { align-self: center; justify-self: center; text-align: center; color: var(--dim); font-size: 19px; max-width: 560px; } #empty b { display: block; color: var(--ink); font-size: 26px; margin-bottom: 8px; }
.item { display: flex; flex-direction: column; min-height: 0; min-width: 0; border: 2px solid var(--edge); border-radius: 14px; background: #000; overflow: hidden; box-shadow: 0 14px 40px #000, 0 2px 6px #000; transition: border-color .15s, box-shadow .15s; }
.item.sel { border-color: var(--blue); box-shadow: 0 0 0 3px #4cc2ff66, 0 14px 40px #000; } .item.sel .ihead { background: #0e3550; }
.item.child { border-color: var(--amber); }
.item.dragover { border-color: var(--green); }
.item.touched { animation: touched 1.8s ease-out; } @keyframes touched { 0% { box-shadow: 0 0 0 4px var(--amber); } 100% { box-shadow: 0 0 0 4px #f5a52400; } }
.ihead { flex: none; display: flex; align-items: center; gap: 10px; padding: 9px 10px 9px 6px; background: var(--surf2); border-bottom: 2px solid #000; cursor: pointer; min-width: 0; }
.grip { cursor: grab; color: var(--dim); padding: 4px; display: flex; } .grip:hover { color: var(--ink); }
.ihead .t { font-size: 19px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ihead .from { font-size: 13px; color: var(--amber); font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 6px; } .ihead .from img { width: 22px; height: 22px; border-radius: 50%; }
.ihead .sp { flex: 1; }
.ihead .steps { font-size: 14px; color: var(--dim); white-space: nowrap; }
.ib { height: 32px; min-width: 32px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--edge); background: #17171a; color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600; flex: none; } .ib:hover { border-color: var(--ink); color: var(--ink); } .ib[disabled] { opacity: .3; pointer-events: none; } .ib svg { width: 17px; height: 17px; }
.iyours { flex: none; display: flex; gap: 10px; align-items: baseline; padding: 7px 12px; font-size: 15px; color: #d8ecff; background: #071a2b; border-bottom: 1px solid #12406a; } .iyours b { color: var(--blue); white-space: nowrap; }
.isay { flex: none; display: flex; gap: 8px; align-items: flex-start; padding: 7px 12px; font-size: 15px; color: #f3d9a4; background: #171204; border-bottom: 1px solid #3a2c0c; } .isay img { width: 22px; height: 22px; border-radius: 50%; flex: none; }
.ibody { flex: 1; min-height: 0; min-width: 0; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.ibody.scroll { overflow: auto; display: block; }
.ibody img.pic { max-width: 100%; max-height: 100%; display: block; cursor: zoom-in; }
.ibody.scroll img.pic { max-height: none; width: 100%; }
.frame { position: relative; overflow: hidden; background: #000; border-radius: 4px; flex: none; }
.frame iframe { border: 0; transform-origin: 0 0; display: block; background: #000; }
.frame .shield { position: absolute; inset: 0; cursor: zoom-in; }
.ways { display: flex; gap: 14px; width: 100%; height: 100%; padding: 12px; }
.way { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.way .hold { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
.way .u { display: flex; align-items: center; gap: 10px; width: 100%; } .way .u b { flex: 1; font-size: 16px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.go { height: 38px; padding: 0 16px; border-radius: 19px; border: 2px solid var(--blue); color: var(--blue); font-weight: 700; font-size: 15px; white-space: nowrap; } .go:hover { background: var(--blue); color: #04121d; }
.words { padding: 18px 26px; font-size: 18px; line-height: 1.55; max-width: 900px; margin: 0 auto; } .words h1 { font-size: 28px; } .words h2 { font-size: 23px; } .words h3 { font-size: 19px; } .words code { background: #26262b; padding: 1px 5px; border-radius: 4px; } .words pre { background: #18181b; padding: 12px; border-radius: 8px; overflow: auto; } .words table { border-collapse: collapse; } .words td, .words th { border: 1px solid var(--line2); padding: 5px 10px; text-align: left; } .words a { color: var(--blue); } .words blockquote { border-left: 3px solid var(--line2); margin-left: 0; padding-left: 14px; color: #d0d0d6; }
.his { padding: 10px 14px; font-size: 16px; color: #bfe6ff; border-top: 1px solid var(--line); flex: none; }

/* ---- ask {{AI}} to ---- */
#foot { border-top: 2px solid #000; background: var(--bar); box-shadow: 0 -6px 18px #000a; position: relative; z-index: 2; padding: 0 16px 14px; }
#chips { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 10px; } #chips:empty { display: none; }
.chip { display: flex; align-items: center; gap: 8px; max-width: 620px; padding: 6px 10px 6px 12px; border-radius: 12px; font-size: 15px; border: 1.5px solid var(--blue); background: #0a1a28; }
.chip b { white-space: nowrap; } .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #dcdce2; }
.chip.sent { border-color: var(--amber); background: #171204; } .chip.done { border-color: var(--green); background: #071a12; } .chip img { width: 22px; height: 22px; border-radius: 50%; }
.chip button { color: var(--dim); font-size: 18px; line-height: 1; padding: 0 2px; } .chip button:hover { color: var(--ink); }
#askrow { display: flex; align-items: center; gap: 12px; padding-top: 12px; }
#askrow h3 { margin: 0 8px 0 4px; font-size: 24px; font-weight: 700; white-space: nowrap; }
.ask { flex: 1 1 0; min-width: 0; height: 60px; border: 2px solid var(--amber); border-radius: 12px; background: #2b1e07; color: #fff; font-size: 18px; font-weight: 650; display: flex; align-items: center; justify-content: center; gap: 10px; white-space: nowrap; transition: background .15s; }
.ask svg { color: var(--amber); } .ask:hover, .ask.on { background: var(--amber); color: #1a1000; } .ask:hover svg, .ask.on svg { color: #1a1000; }
#askbox { position: fixed; z-index: 30; left: 0; bottom: 0; width: 560px; background: #1c1c20; border: 2px solid var(--blue); border-radius: 16px; padding: 14px 16px; box-shadow: 0 18px 60px #000c; display: none; }
#askbox.open { display: block; }
#askbox h4 { margin: 0; font-size: 20px; } #askbox .about { font-size: 15px; color: var(--blue); margin: 4px 0 10px; font-weight: 600; } #askbox .about.none { color: var(--dim); font-weight: 500; }
#askbox textarea, #askbox input { width: 100%; background: #000; border: 1.5px solid var(--line2); border-radius: 10px; color: var(--ink); font: inherit; font-size: 17px; padding: 10px 12px; outline: none; resize: none; } #askbox textarea:focus, #askbox input:focus { border-color: var(--blue); }
#askbox .row { display: flex; align-items: center; gap: 12px; margin-top: 10px; } #askbox .row small { flex: 1; color: var(--dim); font-size: 13px; }
#askbox .add { height: 40px; padding: 0 20px; border-radius: 20px; background: var(--blue); color: #04121d; font-weight: 700; font-size: 16px; } #askbox .no { color: var(--dim); font-size: 15px; }

/* ---- full screen, toast ---- */
#big { position: fixed; inset: 0; z-index: 40; background: #000; display: none; flex-direction: column; } #big.open { display: flex; }
.back { height: 44px; padding: 0 20px 0 14px; border-radius: 22px; background: var(--ink); color: #111; font-size: 17px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; } .back:hover { background: #fff; } .back svg { width: 20px; height: 20px; }
#bigbar { flex: none; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--bar); border-bottom: 2px solid #000; } #bigbar b { font-size: 20px; flex: 1; }
#bigbody { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: auto; } #bigbody img { max-width: 100%; max-height: 100%; }
.ibody { cursor: zoom-in; }
#toast { position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); z-index: 50; background: #2a2a2f; border: 1.5px solid var(--edge); border-radius: 12px; padding: 10px 18px; font-size: 17px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s; } #toast.show { opacity: 1; }
#file { display: none; }
::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: #3a3a41; border-radius: 5px; } ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div id="brand">{{HOME}}<a href="/den/"><b>The Den</b><small>Where we build it together.</small></a></div>
    <div id="mid"><div id="count"></div><div id="tiles"></div></div>
    <div id="acts">
      <button id="send" class="idle"><svg class="i" viewBox="0 0 24 24"><path d="M4 3l17 9-17 9 3-9z"/></svg><span>Send to {{AI}}<small></small></span></button>
      <button id="drop">+ Drop or paste<br>anything</button>
    </div>
  </header>
  <div id="main">
    <aside id="side"></aside>
    <section id="work"></section>
  </div>
  <footer id="foot">
    <div id="chips"></div>
    <div id="askrow"><h3>Ask {{AI}} to</h3></div>
  </footer>
</div>
<div id="askbox"></div>
<div id="big"><div id="bigbar"></div><div id="bigbody"></div></div>
<div id="toast"></div>
<input id="file" type="file" multiple>
<script>
(() => {
const $ = (s, r = document) => r.querySelector(s);
const el = (t, cls, text) => { const e = document.createElement(t); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const api = async (p, opt = {}) => { const r = await fetch('/api/den' + p, { headers: opt.body ? { 'content-type': 'application/json' } : {}, ...opt, body: opt.body ? JSON.stringify(opt.body) : undefined }); if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText); return r.json(); };
const FACE = 'face.png';
const I = { you: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>', picture: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/>', mock: '<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>', text: '<path d="M5 6h14M5 12h14M5 18h9"/>', page: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>', away: '<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a1 1 0 001 1h12a1 1 0 001-1V9M10 13h4"/>', change: '<path d="M4 20l4-1L19 8l-3-3L5 16z"/>', side: '<rect x="3" y="5" width="8" height="14" rx="1"/><rect x="13" y="5" width="8" height="14" rx="1"/>', merge: '<path d="M6 4v5c0 3 6 3 6 7v4M18 4v5c0 3-6 3-6 7"/>', grip: '<circle cx="9" cy="6" r="1.2"/><circle cx="15" cy="6" r="1.2"/><circle cx="9" cy="12" r="1.2"/><circle cx="15" cy="12" r="1.2"/><circle cx="9" cy="18" r="1.2"/><circle cx="15" cy="18" r="1.2"/>', undo: '<path d="M9 7L4 12l5 5M4 12h11a5 5 0 010 10h-2"/>', redo: '<path d="M15 7l5 5-5 5M20 12H9a5 5 0 000 10h2"/>', full: '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>', work: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>' };
const svg = k => `<svg class="i" viewBox="0 0 24 24">${I[k]}</svg>`;
const GROUP = { picture: 'picture', drop: 'picture', mock: 'mock', text: 'text', voice: 'text', page: 'page', file: 'page', chart: 'page' };
const PICTURES = {{PICTURES}};
const ASKS = [...(PICTURES ? [['pictures', 'picture', 'Make pictures']] : []), ['ways', 'side', 'Show me ways'], ['mock', 'mock', 'Build a mock-up'], ['words', 'text', 'Write it up'], ['page', 'page', 'Bring a page']];
const ASKNAME = { pictures: 'Make pictures', ways: 'Show me ways', mock: 'Build a mock-up', words: 'Write it up', change: 'Change this', merge: 'Merge these two', page: 'Look at this page', say: 'Note' };

const SEE = /[?&]see=1/.test(location.search);
let S = { cards: [], bench: [], jobs: [], outbox: { waiting: [], did: [], sent: [] } }, full = {}, filter = null, sel = new Set(), beside = false, big = null, items = {};
const card = id => S.cards.find(c => c.id === id);
const open = () => S.cards.filter(c => c.state !== 'retired');
function toast(t) { const x = $('#toast'); x.textContent = t; x.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => x.classList.remove('show'), 2600); }
const setBench = list => api('/bench', { method: 'POST', body: { items: list, by: 'hunter' } }).catch(e => toast(e.message));

// ---- a small markdown ----
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function inline(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<i>$2</i>').replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank">$1</a>'); }
function md(src) {
  const out = []; const lines = String(src || '').replace(/\r/g, '').split('\n'); let i = 0;
  const para = []; const flush = () => { if (para.length) { out.push('<p>' + inline(para.join(' ')) + '</p>'); para.length = 0; } };

// ---- bringing things in ----

// ---- my hands landing: a mock-up changes in place and glows where I touched it ----
const safeDoc = f => { try { return f.contentDocument; } catch { return null; } };

const ours = n => n && n.nodeType === 1 && n.hasAttribute('data-den');

  for (const a of [...to.attributes]) { const cur = a.name === 'class' ? (from.getAttribute('class') || '').replace(/\s*\bden-glow\b/g, '') : from.getAttribute(a.name); if (cur !== a.value) { from.setAttribute(a.name, a.value); hit = true; } }

}

    const k = sigOf(t); later.set(k, later.get(k) - 1);

    let found = null; for (let n = cur && cur.nextSibling; n; n = n.nextSibling) if (!ours(n) && sigOf(n) === k) { found = n; break; }
    if (found) { from.insertBefore(found, cur); continue; }
    if (cur && !(later.get(sigOf(cur)) > 0) && cur.nodeType === t.nodeType && cur.nodeName === t.nodeName) {

      cur = cur.nextSibling; continue;

}
function glow(ch, doc, frame) {

  const els = [...new Set(ch)].filter(e => e && e.nodeType === 1 && e.isConnected && !quiet.includes(e.nodeName));
  const inner = els.filter(e => !els.some(o => o !== e && e.contains(o))).slice(0, 14);
  if (doc !== document && !doc.getElementById('den-glow-style')) { const st = doc.createElement('style'); st.id = 'den-glow-style'; st.setAttribute('data-den', '1'); st.textContent = '@keyframes denglow{0%{outline:3px solid #f5a524;outline-offset:3px;box-shadow:0 0 0 7px rgba(245,165,36,.28)}100%{outline:3px solid rgba(245,165,36,0);outline-offset:3px;box-shadow:0 0 0 7px rgba(245,165,36,0)}}.den-glow{animation:denglow 1.8s ease-out}'; doc.head.append(st); }

}
/** Lay a new source over a live mock-up. A page that runs scripts is reloaded instead, keeping its place. */
async function patchFrame(f, url) {

// ---- the glass asks where a card is on his screen ----
function toScreen(r) { const bl = Math.max(0, (window.outerWidth - window.innerWidth) / 2), top = Math.max(0, window.outerHeight - window.innerHeight - bl), x = window.screenX + bl, y = window.screenY + top, d = window.devicePixelRatio || 1; return { x1: Math.round(x + r.left * d), y1: Math.round(y + r.top * d), x2: Math.round(x + r.right * d), y2: Math.round(y + r.bottom * d) }; }

function answerAt(ev) {

  else if (it) {

  } else {

    else say = 'the Den itself, not a card: ' + (inside($('#top')) ? 'the top bar' + (hit.closest('.tile') ? ', the "' + hit.closest('.tile').querySelector('.nm').textContent + '" tile' : hit.closest('#send') ? ', Send to {{AI}}' : hit.closest('#drop') ? ', Drop or paste' : hit.closest('#brand') ? ', my picture and the name' : '') : inside($('#foot')) ? 'the Ask {{AI}} to row' + (hit.closest('.ask') ? ', the "' + hit.closest('.ask').textContent + '" button' : hit.closest('.chip') ? ', a waiting chip' : '') : inside($('#side')) ? 'the list on the left' : hit.closest('#merge') ? 'the Merge these two button' : 'the empty work area');

}

// ---- live ----
let loading = null, again = false;
async function refresh() {
  if (loading) { again = true; return loading; }
  loading = (async () => { do { again = false; S = await api(''); renderTop(); renderSide(); renderChips(); await renderWork(); } while (again); })().finally(() => { loading = null; });
  return loading;
}
function live() {
  // Reload when the Den's own files change or it restarts, unless they're typing (Forge, Nov 15).
  let pageV = null;
  setInterval(async () => { try { const { v } = await (await fetch('/api/version', { cache: 'no-store' })).json(); if (pageV && v !== pageV && !document.querySelector('textarea:focus,input:focus') && !$('#askbox').classList.contains('open')) location.reload(); pageV = v; } catch {} }, 5000);
  const es = new EventSource('/api/events');
  es.addEventListener('den', e => {
    const ev = JSON.parse(e.data);

    if (ev.what === 'place' || ev.what === 'draft' || ev.what === 'presence') return;
    if (ev.what === 'page') { if (!$('#askbox').classList.contains('open')) location.reload(); return; }
    if (ev.what === 'way') { const f = items[ev.id] && $(`.way:nth-child(${'abcd'.indexOf(ev.k) + 1}) iframe`, items[ev.id].el); if (f) patchFrame(f, `/api/den/cards/${ev.id}/way/${ev.k}`); return; }

  });

}
