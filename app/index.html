<script>
/* The guard (Nov 17): its own script, so it keeps running when the page's main script breaks.
   An open Den stuck on an error used to stay stuck after the fix landed. Every few seconds this asks
   whether the page file changed since it loaded, and reloads if so. ?see=1 (my still picture) skips it. */
(() => { if (/[?&]see=1/.test(location.search)) return;
  const stamp = () => fetch(location.pathname, { method: 'HEAD', cache: 'no-store' }).then(r => r.headers.get('etag') || r.headers.get('last-modified') || '').catch(() => '');
  let born = null; stamp().then(s => { born = s; });
  setInterval(async () => { const s = await stamp(); if (born && s && s !== born) location.reload(); else if (!born && s) born = s; }, 4000);
})();
</script>
<meta charset="utf-8">
<title>The Den</title>
<script>/* Which Den this window is: its port at the end of its title, in characters nobody sees (a word joiner, then the port in binary as
   zero-width spaces and non-joiners). Two Dens can be open at once, both "The Den"; tile.ps1 reads this so window commands move only this one. */
document.title = 'The Den\u2060' + Number(location.port || 80).toString(2).replace(/0/g, '\u200b').replace(/1/g, '\u200c');</script>

<style>

  --card: #0e0e12;
  --card-hd: #121217;

  --line: rgba(255, 255, 255, 0.075);
  --line2: rgba(255, 255, 255, 0.12);

  --text: #d9d9e0;
  --dim: #8b8b95;
  --faint: #585862;

  /* Restrained Foundry signal palette — signals ONLY, never background washes */

}

* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.14) transparent; }
html, body {
  height: 100%; margin: 0;

}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
a { color: inherit; text-decoration: none; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.24); }
::-webkit-scrollbar-track { background: transparent; }

svg.i { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

#app {
  display: grid;
  grid-template-rows: 64px minmax(0, 1fr);
  height: 100%;

    radial-gradient(rgba(255,255,255,0.045) 1px, transparent 1px) 0 0 / 22px 22px,

/* ---- Sculpted 3-Module Floating Studio Dock (#top) ---- */
#top {
  position: relative; z-index: 5; min-width: 0;
  display: flex; align-items: center; gap: 8px;
  padding: 10px 10px 4px;
  background: transparent;
  border-bottom: 0;
}

/* Module 1A: Sculpted Identity Capsule */
#brand {
  position: relative; flex: none;
  display: grid;
  grid-template-columns: 34px auto auto;
  grid-template-rows: auto auto;
  column-gap: 10px; row-gap: 1px;
  align-items: center; align-content: center;
  height: 48px; padding: 0 14px 0 7px;
  border-radius: 12px;
  background: linear-gradient(180deg, #17171c 0%, #101014 100%);
  border: 1px solid rgba(255,255,255,0.11);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.09), 0 10px 24px -8px rgba(0,0,0,0.85);
}
#plate { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
#brand::before {
  content: ''; grid-column: 1; grid-row: 1 / 3;
  width: 34px; height: 34px; border-radius: 8px;
  background: url(face.png) center / cover no-repeat;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.18), 0 2px 8px rgba(0,0,0,0.65);
}
#brand b {
  grid-column: 2; grid-row: 1; align-self: end;
  font-size: 14.5px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; color: var(--ink);
  white-space: nowrap;
}
#brand small {
  display: block; grid-column: 2; grid-row: 2; align-self: start;
  font-size: 11px; line-height: 1.15; font-weight: 480; color: #7d7d88;
  white-space: nowrap;
}
#brand i.mote {
  grid-column: 3; grid-row: 1 / 3;
  display: none; width: 7px; height: 7px; border-radius: 50%;
  background: var(--amber);
  box-shadow: 0 0 10px rgba(232,168,56,0.8);
  animation: pulseMote 1.6s ease-in-out infinite;
}
#brand.working i.mote { display: block; }
@keyframes pulseMote { 0%, 100% { opacity: 0.4; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.15); } }

/* Module 1B: Tactile Home Keycap (height 48px satisfies den-walk >= 40px) */
#nav {
  flex: none; display: flex; align-items: center; gap: 6px;
  padding: 0; margin: 0; border: 0;
}
#nav:empty { display: none; }
.nb {
  display: inline-flex; align-items: center; gap: 7px;
  height: 48px; padding: 0 13px 0 10px; border-radius: 12px;
  font-size: 13px; font-weight: 600; color: #b8b8c4;
  background: linear-gradient(180deg, #16161b 0%, #101014 100%);
  border: 1px solid rgba(255,255,255,0.10);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 10px 24px -8px rgba(0,0,0,0.8);
  transition: background .14s, color .14s, border-color .14s, transform .1s;
}
.nb svg {
  width: 22px; height: 22px; padding: 3.5px; border-radius: 6px;
  background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.07);
  color: var(--dim); transition: color .14s, border-color .14s;
}
.nb:hover {
  color: var(--ink);
  background: linear-gradient(180deg, #1d1d24 0%, #141419 100%);
  border-color: rgba(255,255,255,0.18);
}
.nb:hover svg { color: var(--ink); border-color: rgba(255,255,255,0.16); }
.nb:active { transform: translateY(1px); }

/* Module 2: Precision-Milled Recessed Card Well */
#strip {
  flex: 1; min-width: 0; height: 48px;
  display: flex; align-items: center;
  padding: 4px 5px;
  border-radius: 13px;
  background: #09090c;
  border: 1px solid rgba(255,255,255,0.085);
  box-shadow: inset 0 2px 8px rgba(0,0,0,0.85), 0 1px 0 rgba(255,255,255,0.04);
}
#row { flex: 1; min-width: 0; height: 100%; display: flex; align-items: center; }
#things {
  flex: 1; min-width: 0; height: 100%;
  display: flex; align-items: center; gap: 5px;
  padding: 0 2px;
  overflow-x: auto; overflow-y: hidden;
  scrollbar-width: none;
  -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent);
}
#things::-webkit-scrollbar { display: none; }

.tab {
  position: relative; flex: none;
  height: 38px; max-width: 238px;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 0 7px 0 7px;
  border-radius: 9px;

}

}
.tab .cx {
  flex: none; width: 20px; height: 20px; border-radius: 5px;

.tab:hover {

}
.tab:hover .cx { opacity: 0.75; }
.tab .cx:hover { opacity: 1; color: var(--ink); background: rgba(255,255,255,0.10); }

/* Raised, Lit Physical Keycaps for Cards Out on the Table */
.tab.out {
  background: linear-gradient(180deg, #212128 0%, #16161b 100%);
  border-color: rgba(255,255,255,0.15);
  color: var(--ink);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.11), 0 4px 12px rgba(0,0,0,0.7);
}

.tab .flag {

.tab .flag.busy { background: rgba(232,168,56,0.14); color: var(--amber2); }

.tab .flag.wait::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 6px var(--amber); }

/* Module 3: Sculpted Drawer Trigger Keycap */
#more {
  flex: none; display: flex; align-items: center;
  padding: 0; border: 0;
}
.addt {
  display: inline-flex; align-items: center; gap: 10px;
  height: 48px; padding: 0 14px 0 10px; border-radius: 12px;
  background: linear-gradient(180deg, #1b1b22 0%, #121217 100%);

  box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), 0 10px 24px -8px rgba(0,0,0,0.85);

.addt .pl {
  width: 28px; height: 28px; border-radius: 8px;

.addt small {
  font-size: 11px; line-height: 1.15; color: #828290; white-space: nowrap;
  padding: 0; background: none; font-variant-numeric: tabular-nums;
}

.none { color: var(--dim); font-size: 13.5px; padding: 6px 4px; align-self: center; }

/* ---- Drafting Canvas & Cards ---- */
#main {
  min-height: 0; display: grid;
  background: transparent;
}
#work {
  position: relative;
  margin: 10px;
  min-height: 0; min-width: 0; padding: 0;

}
#work.over { outline: 1px dashed var(--edge); outline-offset: 4px; border-radius: var(--r); }
#work.grid.n3 .item:nth-child(3) { grid-column: 1 / 3; justify-self: center; width: 62%; }

.split { position: absolute; z-index: 4; border-radius: 4px; }
.split::after {
  content: ''; position: absolute; border-radius: 999px;
  background: rgba(255,255,255,0.10);
  transition: background .15s, transform .15s;
}
.split.v { top: 0; bottom: 0; width: 14px; cursor: col-resize; }
.split.v::after { left: 6px; top: calc(50% - 22px); width: 2px; height: 44px; }
.split.h { left: 0; right: 0; height: 14px; cursor: row-resize; }
.split.h::after { top: 6px; left: calc(50% - 22px); height: 2px; width: 44px; }
.split:hover::after, .split.on::after { background: var(--ink); }
#dragshield { position: fixed; inset: 0; z-index: 60; }

#empty { align-self: center; justify-self: center; text-align: center; color: var(--dim); font-size: 14.5px; max-width: 440px; }
#empty b { display: block; color: var(--ink); font-size: 18px; font-weight: 600; margin-bottom: 4px; }

.item {
  display: flex; flex-direction: column; min-height: 0; min-width: 0;
  border: 1px solid rgba(255, 255, 255, 0.085);
  border-radius: var(--r);
  background: var(--card);
  overflow: hidden;
  box-shadow: 0 18px 44px -10px rgba(0,0,0,0.78), inset 0 1px 0 rgba(255,255,255,0.04);
  transition: border-color .15s, box-shadow .15s;
}
.item.sel {
  border-color: rgba(255,255,255,0.26);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 20px 48px -10px rgba(0,0,0,0.85);
}
.item.child { border-color: rgba(232,168,56,0.42); }
.item.dragover { border-color: var(--green); }
.item.touched { animation: touched 1.6s ease-out; }
@keyframes touched { 0% { box-shadow: 0 0 0 2px var(--amber); } 100% { box-shadow: 0 0 0 2px rgba(232,168,56,0); } }

/* Whisper-quiet integrated studio card header — zero 3D folder tab clutter */
.ihead {
  flex: none; display: flex; align-items: center; gap: 6px;
  height: 38px; padding: 0 8px 0 6px;

}
.grip { cursor: grab; color: var(--faint); opacity: 0.35; padding: 4px 2px; display: flex; transition: opacity .14s, color .14s; }
.ihead:hover .grip { opacity: 0.8; }
.grip:hover { color: var(--ink); opacity: 1; }

.seg { display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 72%; }
.seg .k { width: 15px; height: 15px; color: var(--dim); flex: none; }
.ihead .t {
  font-size: 13px; font-weight: 580; letter-spacing: -0.005em; color: #e8e8ee;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
.ihead .from { font-size: 12px; color: var(--dim); white-space: nowrap; display: flex; align-items: center; gap: 5px; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

.ihead .sp { flex: 1; }

.ib {
  height: 26px; min-width: 26px; padding: 0 6px;
  border-radius: 6px; border: 1px solid transparent;
  background: transparent; color: var(--faint);
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  font-size: 12px; font-weight: 550; flex: none;
  transition: background .12s, color .12s, border-color .12s;
}
.ib svg { width: 15px; height: 15px; }
.ihead:hover .ib { color: var(--dim); }
.ib:hover { background: rgba(255,255,255,0.07); color: var(--ink) !important; }
.ib.close:hover { background: rgba(235,111,85,0.14); color: #ff9b87 !important; }
.ib[disabled] { opacity: 0.25; pointer-events: none; }

.ib.nt { position: relative; padding: 0 7px; }
.ib.nt span { font-size: 11.5px; color: var(--text); font-variant-numeric: tabular-nums; }
.ib.nt.on { background: var(--surf2); border-color: var(--line2); color: var(--ink); }
.ib.nt .dot {
  position: absolute; top: 2px; right: 2px; width: 6px; height: 6px; border-radius: 50%;
  background: var(--amber); box-shadow: 0 0 8px rgba(232,168,56,0.7);
}

.ibody { flex: 1; min-height: 0; min-width: 0; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; cursor: zoom-in; }
.ibody.scroll { overflow: auto; display: block; }
.ibody img.pic { max-width: 100%; max-height: 100%; display: block; margin: 0 auto; cursor: zoom-in; }
.ibody.scroll img.pic { max-height: none; width: 100%; }
.frame { position: relative; overflow: hidden; background: var(--card); flex: none; }
.frame iframe { border: 0; transform-origin: 0 0; display: block; background: var(--card); }
.frame .shield { position: absolute; inset: 0; cursor: zoom-in; }

/* Clean editorial markdown typography */
.words {
  padding: 26px 32px; font-size: 15.5px; line-height: 1.68;
  max-width: 760px; margin: 0 auto; color: var(--text);
}
.words h1 { font-size: 23px; font-weight: 680; letter-spacing: -0.025em; color: var(--ink); margin: 0 0 14px; }
.words h2 { font-size: 18.5px; font-weight: 650; letter-spacing: -0.02em; color: var(--ink); margin: 22px 0 10px; }
.words h3 { font-size: 15.5px; font-weight: 620; color: var(--ink); margin: 18px 0 8px; }
.words p { margin: 0 0 13px; }
.words ul, .words ol { margin: 0 0 14px; padding-left: 20px; }
.words li { margin: 7px 0; }
.words b { color: var(--ink); font-weight: 620; }
.words code { background: rgba(255,255,255,0.07); padding: 2px 6px; border-radius: 5px; font-size: 0.9em; }
.words pre { background: #0a0a0d; border: 1px solid var(--line); padding: 14px; border-radius: 9px; overflow: auto; }
.words table { border-collapse: collapse; width: 100%; margin: 12px 0; }
.words td, .words th { border: 1px solid var(--line2); padding: 7px 11px; text-align: left; }
.words a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.words blockquote { border-left: 2px solid var(--line2); margin: 12px 0; padding-left: 14px; color: var(--dim); }
.his { padding: 10px 14px; font-size: 14px; color: var(--text); border-top: 1px solid var(--line); flex: none; }

/* ---- Everything Drawer (#all) ---- */
#all { position: fixed; inset: 0; z-index: 20; background: rgba(4,4,6,0.80); backdrop-filter: blur(14px); display: none; }
#all.open { display: block; }
#all .box {
  position: absolute; left: 40px; right: 40px; top: 68px; bottom: 28px;
  background: var(--panel); border: 1px solid var(--line2); border-radius: 14px;
  display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 32px 80px rgba(0,0,0,0.85);
}
#all .hd { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
#all .hd b { font-size: 16.5px; font-weight: 650; letter-spacing: -0.015em; }
#all .hd .sp { flex: 1; }

.kinds button { border-radius: 6px; padding: 5px 11px; font-size: 13px; font-weight: 540; color: var(--dim); }
.kinds button:hover { color: var(--ink); }
.kinds button.on { background: var(--surf2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line2); }
.add {
  display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 13px;
  border-radius: 8px; font-size: 13px; font-weight: 580;
  background: var(--surf2); border: 1px solid var(--line2); color: var(--ink);

.add:hover { border-color: var(--edge); background: var(--surf3); }

#side { flex: 1; overflow: auto; padding: 18px; display: grid; grid-template-columns: repeat(auto-fill, 232px); gap: 14px; align-content: start; }

  color: var(--text); height: 100%; background: #101014;
  display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden;

  position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 9px 6px 12px;
  font-size: 12.5px; font-weight: 580; line-height: 1.2;

const KCOL = { picture: 'var(--violet)', drop: 'var(--violet)', mock: 'var(--teal)', text: 'var(--amber)', voice: 'var(--amber)', page: 'var(--warm)', file: 'var(--warm)', chart: 'var(--warm)' };
const KWORD = { picture: 'Picture', drop: 'Picture', mock: 'Mock-up', text: 'Words', voice: 'Voice', page: 'Page', file: 'File', chart: 'Chart' };

const KINDS = [[null, 'All'], ['waiting', 'Waiting on you'], ['picture', 'Pictures'], ['mock', 'Mock-ups'], ['text', 'Words'], ['page', 'Pages'], ['away', 'Put away']];
