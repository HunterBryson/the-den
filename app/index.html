<script>
/* The guard (Nov 17): its own script, so it keeps running when the page's main script breaks.
   An open Den stuck on an error used to stay stuck after the fix landed. Every few seconds this asks
   whether the page file changed since it loaded, and reloads if so. ?see=1 (my still picture) skips it. */
(() => { if (/[?&]see=1/.test(location.search)) return;
  const stamp = () => fetch(location.pathname, { method: 'HEAD', cache: 'no-store' }).then(r => r.headers.get('etag') || r.headers.get('last-modified') || '').catch(() => '');
  let born = null; stamp().then(s => { born = s; });
  setInterval(async () => { const s = await stamp(); if (born && s && s !== born) location.reload(); else if (!born && s) born = s; }, 4000);
})();
</script>

<script>/* Which Den this window is: its port at the end of its title, in characters nobody sees (a word joiner, then the port in binary as

document.title = 'The Den\u2060' + Number(location.port || 80).toString(2).replace(/0/g, '\u200b').replace(/1/g, '\u200c');</script>
